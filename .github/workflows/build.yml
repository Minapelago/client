name: build

# Reusable build of the mod drop-in for both platforms. The Linux leg also builds and runs the native tests. Called by ci.yml, for pull requests
# and as release.yml's gate; on a release commit, the gate's drop-ins are the ones release.yml publishes.

on:
  workflow_call:

# Reuse vcpkg-built binaries across runs via a workspace-local file cache.
env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, preset: clang-x64-release, label: "Build mod (Linux x86_64, Frida)" }
          - { os: windows-2022, platform: windows, preset: clang-cl-x64-release, label: "Build mod (Windows clang-cl x64)" }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Install toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Set up MSVC environment (x64)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
      # A merged release PR changes only the release-please manifests and CHANGELOG.md, so its code is its parent's. Tagging it locally makes git
      # describe stamp the version release-please is about to tag, so release.yml can publish these drop-ins without building again. The tests
      # are skipped when the parent's release run already passed them on the same code.
      - name: Detect a release commit
        id: release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet HEAD^ HEAD -- .github/prerelease-manifest.json && exit 0
          git tag -f "v$(sed -n 's/.*"\.": *"\([^"]*\)".*/\1/p' .github/prerelease-manifest.json)"
          parent=$(gh run list -w release.yml -c "$(git rev-parse HEAD^)" --json conclusion -q '.[0].conclusion')
          if git diff --quiet HEAD^ HEAD -- . ':!CHANGELOG.md' ':!.github/*-manifest.json' && [ "$parent" = success ]; then
            echo "tested=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure and build tests
        if: runner.os == 'Linux' && steps.release.outputs.tested != '1'
        run: cmake --preset clang-x64-tests && cmake --build --preset clang-x64-tests
      - name: Test
        if: runner.os == 'Linux' && steps.release.outputs.tested != '1'
        run: ctest --preset clang-x64-tests --output-on-failure --output-junit "$GITHUB_WORKSPACE/test-results.xml"
      - name: Upload test results (JUnit)
        if: always() && runner.os == 'Linux' && steps.release.outputs.tested != '1'
        uses: actions/upload-artifact@v7
        with:
          name: junit-native-tests
          path: test-results.xml
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # release.yml finds the drop-ins by this name, so a release commit that stamped the wrong version fails there.
      - name: Name the artifact
        id: artifact
        shell: bash
        run: echo "name=mod-${{ matrix.platform }}-$(cat build/${{ matrix.preset }}/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload mod drop-in
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/${{ matrix.preset }}/mods/
          if-no-files-found: error
