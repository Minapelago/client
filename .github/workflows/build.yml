name: build

# Reusable build of the mod drop-in for both platforms. The Linux leg also builds and runs the native tests. Called by ci.yml, for pull requests
# and as release.yml's gate; on a release commit, the gate's drop-ins are the ones release.yml publishes.

on:
  workflow_call:

# Reuse vcpkg-built binaries across runs via a workspace-local file cache. CMake reads the launcher variables on a fresh configure, so every
# compile goes through ccache; a build that only moves the version recompiles the two files that include mth_version.h.
env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, preset: clang-x64-release, label: "Build mod (Linux x86_64, Frida)" }
          - { os: windows-2022, platform: windows, preset: clang-cl-x64-release, label: "Build mod (Windows clang-cl x64)" }
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      # Skip what an earlier run already did. When this commit changes only docs or the release-please manifests and the base commit's release
      # gate passed, its code is already built and tested. A push that moves the prerelease manifest is a merged release PR: it still builds,
      # tagged locally first so git describe stamps the version release-please is about to tag, and release.yml publishes those drop-ins.
      # The jobs still run when they skip, so the required checks report.
      - name: Plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          # The parent on a push, the base branch tip on a pull request's merge commit.
          base=$(git rev-parse HEAD^)
          run=$(gh run list -w release.yml -c "$base" --json databaseId -q '.[0].databaseId' || true)
          green=false
          if [ -n "$run" ]; then
            green=$(gh run view "$run" --json jobs -q '[.jobs[] | select(.name | startswith("Gate /"))] | length > 0 and all(.conclusion == "success")' || echo false)
          fi
          work=1
          if [ "$green" = true ] && git diff --quiet "$base" HEAD -- . ':!*.md' ':!docs/' ':!.github/*-manifest.json' ':!.github/ISSUE_TEMPLATE/'; then
            work=0
          fi
          echo "test=$work" >> "$GITHUB_OUTPUT"
          if [ "$IS_PUSH" = true ] && ! git diff --quiet "$base" HEAD -- .github/prerelease-manifest.json; then
            git tag -f "v$(sed -n 's/.*"\.": *"\([^"]*\)".*/\1/p' .github/prerelease-manifest.json)"
            work=1
          fi
          echo "build=$work" >> "$GITHUB_OUTPUT"
      - name: Install toolchain
        if: runner.os == 'Linux' && steps.plan.outputs.build == '1'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Set up MSVC environment (x64)
        if: runner.os == 'Windows' && steps.plan.outputs.build == '1'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
      # Only master pushes save. Pull requests restore master's cache, and an entry one saves is visible only to that same pull request.
      - name: Set up ccache
        if: steps.plan.outputs.build == '1'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.platform }}
          max-size: 1G
          save: ${{ github.event_name == 'push' }}
      - name: Cache vcpkg binaries
        if: steps.plan.outputs.build == '1'
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
      - name: Configure and build tests
        if: runner.os == 'Linux' && steps.plan.outputs.test == '1'
        run: cmake --preset clang-x64-tests && cmake --build --preset clang-x64-tests
      - name: Test
        if: runner.os == 'Linux' && steps.plan.outputs.test == '1'
        run: ctest --preset clang-x64-tests --output-on-failure --output-junit "$GITHUB_WORKSPACE/test-results.xml"
      - name: Upload test results (JUnit)
        if: always() && runner.os == 'Linux' && steps.plan.outputs.test == '1'
        uses: actions/upload-artifact@v7
        with:
          name: junit-native-tests
          path: test-results.xml
      - name: Configure
        if: steps.plan.outputs.build == '1'
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        if: steps.plan.outputs.build == '1'
        run: cmake --build --preset ${{ matrix.preset }}
      # release.yml finds the drop-ins by this name, so a release commit that stamped the wrong version fails there.
      - name: Name the artifact
        id: artifact
        if: steps.plan.outputs.build == '1'
        shell: bash
        run: echo "name=mod-${{ matrix.platform }}-$(cat build/${{ matrix.preset }}/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload mod drop-in
        if: steps.plan.outputs.build == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/${{ matrix.preset }}/mods/
          if-no-files-found: error
