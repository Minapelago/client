name: ci

# release.yml calls this as its gate, which covers pushes to master. Pull requests run it directly.
on:
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting (clang-format 21.1.8)
        run: |
          python3 -m venv /tmp/cf
          /tmp/cf/bin/pip install --quiet clang-format==21.1.8
          PATH="/tmp/cf/bin:$PATH" bash format.sh --dry-run --Werror

  build:
    name: Build
    needs: format
    uses: ./.github/workflows/build.yml
